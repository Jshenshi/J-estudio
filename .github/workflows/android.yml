
name: Build Jorge 3D Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip -q *.zip -d proyecto
          find proyecto -name settings.gradle

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          gradle -p proyecto/Jorge3DStudio app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jorge-3D-Studio-APK
          path: proyecto/Jorge3DStudio/app/build/outputs/apk/debug/*.apk
